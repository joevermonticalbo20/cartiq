name: API CI

on:
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: api

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test test/*.test.js

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/firestore.js
          for f in src/middleware/*.js src/routes/*.js src/services/*.js scripts/seed_firestore.mjs scripts/seed_history.mjs; do node --check "$f"; done

  # Full regression: Firestore emulator + seeded API + every phase suite.
  # This is the job that would have caught the stock/IDOR/auth regressions
  # before they merged; the fast `validate` job above stays for quick syntax.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Setup Java 21 (Firestore emulator requirement)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore emulator
        run: firebase emulators:start --only firestore > /tmp/emulator.log 2>&1 &
        working-directory: .

      - name: Seed emulator database
        run: npm run db:seed
        working-directory: api
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          JWT_SECRET: "ci-test-secret"

      - name: Seed 21-day sales history (phase3 forecast suites require it)
        run: node scripts/seed_history.mjs 21
        working-directory: api
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          JWT_SECRET: "ci-test-secret"

      - name: Start API against emulator
        run: node src/server.js > /tmp/api.log 2>&1 &
        working-directory: api
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          JWT_SECRET: "ci-test-secret"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret"
          HOST: "127.0.0.1"
          PORT: "4000"
          DISABLE_MDNS: "true"

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 5
          done
          echo "API failed to start"; tail -n 50 /tmp/api.log; tail -n 20 /tmp/emulator.log; exit 1

      - name: Run phase suites (2-8) + authz regression
        run: |
          for p in 2 3 4 5 6 7 8; do node scripts/phase${p}_test.mjs || exit 1; done
          node scripts/test_authz_fix.mjs || exit 1
        working-directory: api
