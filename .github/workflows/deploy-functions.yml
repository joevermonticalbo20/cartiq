# Deploy Supabase Edge Functions on push to main.
# The dashboard GitHub integration does NOT deploy functions (migrations
# only), so this workflow does it via the official setup-cli action.
# Needs repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard -> Account ->
# Access Tokens). Runs on GitHub's runners, so no local CLI/Docker needed.
name: Deploy Edge Functions

# Queue concurrent deploys so they run in order - see deploy-hosting.yml.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ezynbxzarxozzmwqdjxs
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt keeps the dashboard behavior (our own CartIQ JWT
      # guards every route; the Supabase gateway check stays OFF).
      # No function name = deploy everything under supabase/functions/.
      #
      # Stamp the commit SHA and the deploy time into the function's secrets
      # first, so /health can report WHICH build is actually serving traffic.
      # The old build marker was a hand-edited literal that sat at
      # "ratelimit-voidwarn-2026-10-05" for weeks while newer code ran -
      # which made it useless for exactly the job it was there for.
      - name: Stamp the build marker
        run: |
          supabase secrets set \
            DEPLOY_SHA="${GITHUB_SHA}" \
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --project-ref $PROJECT_REF --yes

      # Gmail API OTP delivery needs these four secrets. They are free (Gmail
      # API standard quota) and do not require a billing account. The step is
      # skipped with a warning until all four are added under
      # Settings -> Secrets and variables -> Actions, so a fork/local deploy
      # still succeeds without email configured.
      - name: Sync Gmail OTP secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
        run: |
          set -euo pipefail
          args=()
          for name in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_FROM; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::warning::$name is not set in GitHub Actions; production OTP email will not work until it is."
            else
              args+=("$name=$value")
            fi
          done
          if [ ${#args[@]} -eq 4 ]; then
            supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF" --yes
          else
            echo "Skipped syncing incomplete Gmail credentials; existing Supabase secrets were left untouched."
          fi

      - run: supabase functions deploy --project-ref $PROJECT_REF --no-verify-jwt
