# Deploy Supabase Edge Functions on push to main.
# The dashboard GitHub integration does NOT deploy functions (migrations
# only), so this workflow does it via the official setup-cli action.
# Needs repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard -> Account ->
# Access Tokens). Runs on GitHub's runners, so no local CLI/Docker needed.
name: Deploy Edge Functions

# Queue concurrent deploys so they run in order - see deploy-hosting.yml.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ezynbxzarxozzmwqdjxs
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt keeps the dashboard behavior (our own CartIQ JWT
      # guards every route; the Supabase gateway check stays OFF).
      # No function name = deploy everything under supabase/functions/.
      #
      # Stamp the commit SHA and the deploy time into the function's secrets
      # first, so /health can report WHICH build is actually serving traffic.
      # The old build marker was a hand-edited literal that sat at
      # "ratelimit-voidwarn-2026-10-05" for weeks while newer code ran -
      # which made it useless for exactly the job it was there for.
      - name: Stamp the build marker
        run: |
          supabase secrets set \
            DEPLOY_SHA="${GITHUB_SHA}" \
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --project-ref $PROJECT_REF --yes

      - run: supabase functions deploy --project-ref $PROJECT_REF --no-verify-jwt
