# Deploy Supabase Edge Functions on push to main.
# The dashboard GitHub integration does NOT deploy functions (migrations
# only), so this workflow does it via the official setup-cli action.
# Needs repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard -> Account ->
# Access Tokens). Runs on GitHub's runners, so no local CLI/Docker needed.
name: Deploy Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ezynbxzarxozzmwqdjxs
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt keeps the dashboard behavior (our own CartIQ JWT
      # guards every route; the Supabase gateway check stays OFF).
      - run: supabase functions deploy api --project-ref $PROJECT_REF --no-verify-jwt
