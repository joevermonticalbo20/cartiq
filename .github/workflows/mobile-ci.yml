name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: Flutter is moving package:flutter/material.dart to
        # package:material_ui/material_ui.dart, so a newer stable SDK reports
        # that deprecation on every file of the project. It is an INFO, not a
        # defect - the code is unaffected until the package split lands - and
        # the whole repo would fail CI on it. Warnings and errors stay fatal.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
